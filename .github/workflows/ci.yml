name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  checks:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: waven
          POSTGRES_PASSWORD: waven
          POSTGRES_DB: waven_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U waven -d waven_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      TEST_DATABASE_URL: postgres://waven:waven@localhost:5433/waven_test

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: API e2e tests
        run: pnpm -F api test:e2e

      - name: Build
        run: pnpm build

      - name: Audit dependencies (non-blocking)
        run: pnpm audit --audit-level high
        continue-on-error: true
